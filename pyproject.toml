[project]
name = "gnucash-bill-processor"
version = "0.1.0"
description = "Automate vendor bill entry with address lookup for GnuCash"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28.0",
    "thefuzz>=0.20.0",
    "python-Levenshtein>=0.21.0",
    "loguru>=0.7.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "hypothesis>=6.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "hypothesis>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
markers = [
    "manual: marks tests as requiring manual verification (deselect with '-m \"not manual\"')"
]