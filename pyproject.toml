[project]
name = "gnucash-bill-processor"
version = "0.1.0"
description = "Automate vendor bill entry with address lookup for GnuCash"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28.0",
    "thefuzz>=0.20.0",
    "python-Levenshtein>=0.21.0",
    "loguru>=0.7.3",
    "python-dotenv>=1.0.0",
    "piecash>=1.2.1",
    "fastapi>=0.135.1",
    "uvicorn[standard]>=0.41.0",
    "jinja2>=3.1.6",
    "httpx>=0.28.1",
    "python-multipart>=0.0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "hypothesis>=6.0.0",
]

[project.scripts]
bill-processor = "bill_processor.main:main"
bill-entry = "bill_processor.bill_entry_gui:main"
vendor-manager-gui = "bill_processor.vendor_manager_gui:main"
vendor-sync = "bill_processor.vendor_sync:main"
bill-web = "bill_processor.web.app:app"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "hypothesis>=6.0.0",
    "pytest-cov>=7.0.0",
    "httpx>=0.28.1",
]

[tool.setuptools.packages.find]
include = ["bill_processor*"]

[tool.pytest.ini_options]
testpaths = ["bill_processor/tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
markers = [
    "manual: marks tests as requiring manual verification (deselect with '-m \"not manual\"')"
]
